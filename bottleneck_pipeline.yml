id: bottleneck_data_pipeline
namespace: com.bottleneck.analytics

description: Workflow d'automatisation mensuel du CA et de classification des vins pour BottleNeck.

triggers:
  - id: planification_mensuelle
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 15 * *" # Tous les 15 du mois à 9h00

tasks:
  - id: traitement_et_analyse
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13-slim
    beforeCommands:
      - pip install pandas openpyxl duckdb
    commands:
      - python etl_duckdb.py

    outputFiles:
      - "rapport_chiffre_affaires.xlsx"
      - "vins_premium.csv"
      - "vins_ordinaires.csv"